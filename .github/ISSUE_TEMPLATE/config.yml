blank_issues_enabled: false
contact_links:
  - name: Ask a question (how do I…, why does it work this way)
    url: https://github.com/promise-language/promise/discussions/categories/q-a
    about: Post in Discussions → Q&A. It's searchable, so an answer helps the next person too.
  - name: Propose a language or standard-library change
    url: https://github.com/promise-language/promise/discussions/categories/ideas
    about: Propose it here first. A settled idea moves to a feature request, then a PR — not a PR first.
  - name: Report a security vulnerability
    url: https://github.com/promise-language/promise/security/policy
    about: Do NOT file security issues publicly. Report privately per the Security Policy (security@promise-lang.org).
  - name: Something else
    url: mailto:hello@promise-lang.org
    about: For anything that isn't a bug, a question, an idea, or a security issue.
