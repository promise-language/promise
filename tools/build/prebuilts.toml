# Pinned prebuilt binaries embedded in `bin/promise --release`.
#
# `bin/build --release` always downloads from the URLs below into the
# host-stable prebuilts cache (~/Library/Caches/promise/prebuilts on macOS,
# ~/.cache/promise/prebuilts on Linux, %LOCALAPPDATA%\promise\prebuilts on
# Windows; override with PROMISE_PREBUILTS_CACHE). Subsequent builds reuse
# the cache.
#
# To pin a new version: bump `version`, update URLs, run `bin/pin-prebuilts`
# (which downloads each URL, computes its sha256, and writes it back here).
# Empty `sha256` skips verification with a loud warning — fine for development,
# MUST be filled in before release.
#
# The `out` field is the cache-relative file name *without* the .gz suffix.
# At build time, the file is gzipped into the embed dir as "<out>.gz". At
# runtime / in the prebuilts cache, it lives as "<out>" (raw, executable).
#
# A file marked `build_only = true` is sliced into the build-host slim cache and
# hosted as a blob (so a prebuilt-only dev/CI host can use it), but is NOT
# embedded into the shipped client binary and NOT projected into the client
# runtime manifest. Used for build-time tools — e.g. llvm-dlltool, which
# regenerates the Windows winlink import libraries at `bin/build` time and is
# never invoked by `promise build` on a client (T0772/T0833).

schema = 1

# ----------------------------------------------------------------------------
# LLVM toolchain (opt, llc, lld, libLLVM) — required for codegen + linking.
# ----------------------------------------------------------------------------
[binaries.llvm]
version = "22.1.0"
# Where bundle ops write their gzipped output (relative to repo root).
# The runtime extraction layer in compiler/cmd/promise/llvm_*.go reads from
# <bundle_dir>/<target>/*.gz via //go:embed, so this path is fixed.
bundle_dir = "compiler/cmd/promise/resources/llvm"

[binaries.llvm.targets.linux-amd64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz"
sha256 = "8d662e425e46c48b45f5f970770b5e37f323607c8c2cbc371593fc9c4ba1e7b3"
# The upstream LLVM-22.1.0-Linux-X64.tar.xz links LLVM itself statically (bin/lld
# is 199 MB — no libLLVM.so / liblld* / libz3 / libzstd needed at runtime), but
# the binaries are not fully static: they need libstdc++/libgcc_s/libz/libm/libc,
# and lld additionally carries a DT_NEEDED on libxml2.so.2 for LLVM's COFF
# manifest merger. libxml2 is absent from a base Linux install, and lld is
# BIND_NOW, so the compiler generates its own stub libxml2 into the toolchain
# view dir rather than requiring one to be installed (T1774 —
# compiler/internal/elfstub).
files = [
  { src = "bin/opt", out = "opt" },
  { src = "bin/llc", out = "llc" },
  { src = "bin/lld", out = "lld" },
  # Build-only: regenerates the Windows winlink import libs (T0772/T0833).
  { src = "bin/llvm-dlltool", out = "llvm-dlltool", build_only = true },
]

[binaries.llvm.targets.linux-arm64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-ARM64.tar.xz"
sha256 = "e3b4205fe45d5561dec9d46465873a79c26b25b028b310515b38c34f668c6aec"
files = [
  { src = "bin/opt", out = "opt" },
  { src = "bin/llc", out = "llc" },
  { src = "bin/lld", out = "lld" },
  # Build-only: regenerates the Windows winlink import libs (T0772/T0833).
  { src = "bin/llvm-dlltool", out = "llvm-dlltool", build_only = true },
]

[binaries.llvm.targets.darwin-arm64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-macOS-ARM64.tar.xz"
sha256 = "cd5e615f4dab23d0239359cd343202c5f6ceeaf072c245a3c685d73afac09646"
# The upstream LLVM-22.1.0-macOS-ARM64.tar.xz ships statically-linked binaries
# (bin/lld is 131 MB, depends only on system libs). No libLLVM.dylib /
# liblld*.dylib / libz3 / libzstd shared libraries needed at runtime.
files = [
  { src = "bin/opt", out = "opt" },
  { src = "bin/llc", out = "llc" },
  { src = "bin/lld", out = "lld" },
  # Build-only: regenerates the Windows winlink import libs (T0772/T0833).
  { src = "bin/llvm-dlltool", out = "llvm-dlltool", build_only = true },
]

[binaries.llvm.targets.darwin-amd64]
# Upstream LLVM stopped publishing macOS x86_64 tarballs at version 22 (the
# release page only ships LLVM-22.1.0-macOS-ARM64.tar.xz). The entry stays
# here so a community member can fill it in later if they host an x86_64
# build under their own URL — until then, `bin/build --release` surfaces
# the `unsupported` reason verbatim and refuses to build for this target.
unsupported = "no upstream LLVM 22.1.0 tarball for macOS x86_64; Apple Silicon only on this release"
url = ""
sha256 = ""
files = []

[binaries.llvm.targets.windows-amd64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz"
sha256 = "2dd6a6c990865f98766dec58cce1cbfba48e5affc0098e5b1fff96c2f1d23e81"
files = [
  { src = "bin/opt.exe", out = "opt.exe" },
  { src = "bin/llc.exe", out = "llc.exe" },
  # Codegen aliases lld.exe to lld-link at runtime (see llvm_windows_amd64.go).
  { src = "bin/lld.exe", out = "lld.exe" },
  # Build-only: regenerates the Windows winlink import libs (T0772/T0833).
  { src = "bin/llvm-dlltool.exe", out = "llvm-dlltool.exe", build_only = true },
]

# ----------------------------------------------------------------------------
# musl CRT (crt1.o, crti.o, crtn.o, libc.a) — required to link Linux binaries.
#
# Promise links Linux targets `-static` against musl, so these objects are a
# *target* dependency, not a host one: `target` below is the Linux target being
# linked FOR. They were previously scraped off the build host's /usr/lib
# (`musl-dev` package) at `bin/build` time, which made the build depend on
# preinstalled system state and broke outright on hosts that have no musl-dev
# (T0530). Now they are fetched like every other prebuilt.
#
# Source: musl.libc.org publishes SOURCE ONLY — there is no upstream binary
# release to mirror the LLVM pattern against. Alpine is the reference musl
# distribution, and its `musl-dev` package is the canonical prebuilt (2.4 MiB,
# per-arch). The apk is three concatenated gzip tar streams; tools/build/common/
# apk.go extracts it with the stdlib.
#
# Alpine prunes superseded package revisions from the CDN, so a URL here can rot
# on an Alpine `-rN` bump. That is contained: once `bin/release publish-blobs
# --dependency musl --host <target>` has run, the content-addressed blob is
# hosted by us and the upstream URL is only a last-resort fallback source. A
# rotted URL surfaces as a loud 404 at pin time, never as silently different
# bytes — `version` carries the full `1.2.5-rN` so a revision bump is a new
# catalog identity rather than a mutation of an existing one.
# ----------------------------------------------------------------------------
[binaries.musl]
version = "1.2.5-r23"
# Raw (not gzipped) per-arch CRT objects land in <bundle_dir>/<musl-arch>/ for
# `//go:embed resources/crt/<musl-arch>/*` — see compiler/cmd/promise/crt_linux_*.go.
bundle_dir = "compiler/cmd/promise/resources/crt"

[binaries.musl.targets.linux-amd64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/musl-dev-1.2.5-r23.apk"
sha256 = "2ea566b665ebaea4f84cee1e4b7ef093b0aa67356006e84deb26d9bd7a716c6b"
files = [
  { src = "usr/lib/crt1.o", out = "crt1.o" },
  { src = "usr/lib/crti.o", out = "crti.o" },
  { src = "usr/lib/crtn.o", out = "crtn.o" },
  { src = "usr/lib/libc.a", out = "libc.a" },
]

[binaries.musl.targets.linux-arm64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/aarch64/musl-dev-1.2.5-r23.apk"
sha256 = "19032a762b8c6967d3789de1bf540754a0121e517402022eebd3ae6f1c9965a4"
files = [
  { src = "usr/lib/crt1.o", out = "crt1.o" },
  { src = "usr/lib/crti.o", out = "crti.o" },
  { src = "usr/lib/crtn.o", out = "crtn.o" },
  { src = "usr/lib/libc.a", out = "libc.a" },
]

# ----------------------------------------------------------------------------
# OpenSSL static archives (libssl.a, libcrypto.a) — required to link Promise
# programs that use TLS (#28 — internal: T1596; unblocks T0077).
#
# Like the musl CRT above, these are a *target* dependency: Promise links Linux
# binaries `-static` against musl, so a TLS program must link a musl-built
# static OpenSSL rather than the host's glibc `libssl.so.3`. Alpine's
# `openssl-libs-static` package ships exactly `usr/lib/libssl.a` +
# `usr/lib/libcrypto.a` built against musl, on the same CDN and apk format
# tools/build/common/apk.go already parses. Pinned to the SAME Alpine branch as
# the musl CRT (v3.23 main) so the two dependencies share one distro baseline.
#
# Nothing links OpenSSL yet: this item introduces the `needsTLS` link gate but
# never sets it true (no program declares a `promise_tls_*` extern until T0077
# emits the codegen bridge). The pin exists so that machinery is in place and
# testable ahead of any TLS code.
#
# VERIFIED 2026-08-19 against the live Alpine CDN (#28 step 0):
#   - package name `openssl-libs-static` is correct; current revision 3.5.7-r0
#   - both apks ship `usr/lib/libssl.a` + `usr/lib/libcrypto.a`
#   - x86_64 apk 14,235,266 B -> libssl.a 6,955,116 B, libcrypto.a 28,162,174 B
#   - a static musl binary calling SSL_CTX_new(TLS_client_method()) links and
#     runs on the reference host, via `ld.lld -static --gc-sections` with the
#     archives spliced after the objects and before libc.a, on BOTH the plain
#     and the `--lto-O1` (release) path.
#   - the default provider is fully functional statically: EVP_sha256 digests
#     correctly, EVP_MD_fetch("SHA2-256") succeeds and RAND_bytes succeeds.
#     musl's static dlopen stubs therefore do NOT impair the default provider;
#     they only preclude loading external/legacy providers from disk.
#   - linux-arm64 is pinned from the same branch/revision but is NOT
#     link-verified — the reference host is x86_64.
# ----------------------------------------------------------------------------
[binaries.openssl]
version = "3.5.7-r0"
# Raw (not gzipped) per-arch static archives land in <bundle_dir>/<musl-arch>/
# for `//go:embed resources/openssl/<musl-arch>/*` — see
# compiler/cmd/promise/openssl_linux_*.go.
bundle_dir = "compiler/cmd/promise/resources/openssl"

[binaries.openssl.targets.linux-amd64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/openssl-libs-static-3.5.7-r0.apk"
sha256 = "2eb5c7a1307ecdc391fbb597ec024c12f0144937a3dca88414de6e093290aa39"
files = [
  { src = "usr/lib/libssl.a", out = "libssl.a" },
  { src = "usr/lib/libcrypto.a", out = "libcrypto.a" },
]

[binaries.openssl.targets.linux-arm64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/aarch64/openssl-libs-static-3.5.7-r0.apk"
sha256 = "592bb90fd5156de0a6dc657e154246eaa18f8c6e40677fb013c5a42b094eae86"
files = [
  { src = "usr/lib/libssl.a", out = "libssl.a" },
  { src = "usr/lib/libcrypto.a", out = "libcrypto.a" },
]

# ----------------------------------------------------------------------------
# compiler-rt builtins (libclang_rt.builtins.a) — required to link ANY Linux
# binary (T1676).
#
# Promise links Linux targets `-static` against musl with `ld.lld` and, until
# this pin, nothing else: no libgcc, no compiler-rt. That premise held only
# because x86-64 codegen happens not to need the compiler runtime. It does not
# hold on aarch64, and the gap is NOT TLS-specific even though a TLS link is
# what first exposed it:
#
#   - musl's OWN libc.a (vfprintf.lo, vfscanf.lo, floatscan.lo) calls the
#     soft-float IEEE binary128 helpers (__addtf3, __multf3, __trunctfdf2, …)
#     because aarch64 `long double` is binary128 with no hardware support. Any
#     program whose link pulls musl's float printf/scanf path needs them.
#   - prebuilt aarch64 objects (the vendored musl-static OpenSSL, T1596)
#     reference the LSE outline-atomics helpers `__aarch64_{ldadd,ldclr,ldset}
#     {4,8}{_relax,_acq,_rel,_acq_rel}`, which GCC ≥ 10 / Clang emit by default
#     under `-moutline-atomics`.
#
# Neither family can be honestly provided in-IR: the outline-atomics helpers use
# a restricted register convention (only x0/x1, x15–x17, x30, NZCV may be
# clobbered) that an llc-compiled function silently violates — a miscompile, not
# a link error — and binary128 add/mul/div with correct rounding and subnormals
# is not something to reimplement. So we link the real archive.
#
# Like the musl CRT and OpenSSL above, this is a *target* dependency: `target`
# is the Linux target being linked FOR. Source is Alpine's `compiler-rt`
# package, pinned to the SAME Alpine branch as musl-dev and openssl-libs-static
# (v3.23 main) so all three target dependencies share one distro baseline.
# Apache-2.0 with LLVM Exception (see NOTICE).
#
# Pinned for BOTH Linux arches and spliced onto the link line unconditionally.
# linux-amd64 needs nothing from it today (x87 80-bit long double, no outline
# atomics), but keeping the machinery symmetric costs nothing: unreferenced
# archive members are never extracted.
#
# VERIFIED 2026-08-22 against the live Alpine CDN (T1676 step 0):
#   - package name `compiler-rt` is correct; current revision 21.1.2-r0
#   - aarch64 apk 12,546,484 B -> libclang_rt.builtins-aarch64.a 1,343,400 B
#   - x86_64  apk 16,170,797 B -> libclang_rt.builtins-x86_64.a  1,027,996 B
#   - the aarch64 archive defines all 26 symbols the failing TLS link reported
#     undefined, plus the `__aarch64_have_lse_atomics` ifunc flag they dispatch
#     on.
#   - its own externally-undefined set is entirely musl libc (malloc, memcpy,
#     getauxval, pthread_*, …) plus `_Unwind_*` in gcc_personality_v0.c.o, which
#     nothing pulls. lld's lazy archive resolution satisfies those back into the
#     EARLIER libc.a, so no `--start-group` is needed.
# ----------------------------------------------------------------------------
[binaries.compiler-rt]
version = "21.1.2-r0"
# Raw (not gzipped) per-arch builtins archive lands in <bundle_dir>/<musl-arch>/
# for `//go:embed resources/compiler-rt/<musl-arch>/*` — see
# compiler/cmd/promise/compiler_rt_linux_*.go. The `out` name is deliberately
# arch-neutral: each arch already has its own directory, so qualifying the file
# name would only complicate every consumer.
bundle_dir = "compiler/cmd/promise/resources/compiler-rt"

[binaries.compiler-rt.targets.linux-amd64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/compiler-rt-21.1.2-r0.apk"
sha256 = "1c2f55bf9d4c6d1dc3a95d67be09114a08f4befcaee06444b563ef0e3571285b"
files = [
  { src = "usr/lib/llvm21/lib/clang/21/lib/x86_64-alpine-linux-musl/libclang_rt.builtins-x86_64.a", out = "libclang_rt.builtins.a" },
]

[binaries.compiler-rt.targets.linux-arm64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/aarch64/compiler-rt-21.1.2-r0.apk"
sha256 = "c8dc9a9e98a23a30f4b5c89f44b7978e1d45db637742824304e0031aca12b200"
files = [
  { src = "usr/lib/llvm21/lib/clang/21/lib/aarch64-alpine-linux-musl/libclang_rt.builtins-aarch64.a", out = "libclang_rt.builtins.a" },
]
