# Build + test CI (docs/release-automation.md §4) — MANUAL DISPATCH ONLY.
#
# This does NOT run on every push/PR. The project's internal gates already cover
# correctness: `bin/verify` is mandatory before every push, and periodic gates run
# stress + cross-platform checks. At 20-80 commits/day on a private repo (where
# Actions minutes are metered and macOS bills 10x), per-commit CI is not feasible.
# This workflow exists to validate that the build+test toolchain works on GitHub
# runners for the release pipeline (release.yml). Dispatch it on demand, picking a
# single platform to control cost. It does NOT produce release artifacts — that is
# release.yml, triggered by an `epoch-*` tag.
name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build + test"
        type: choice
        default: all
        options:
          - all
          - linux-amd64
          - linux-arm64
          - darwin-arm64
          - windows-amd64
      run_tests:
        description: "Run the full test suite (false = build only — a cheap toolchain check; the suite is slow and macOS bills 10x)"
        type: boolean
        default: true

# CI only builds and tests — it never writes to the repo. Pin the GITHUB_TOKEN to
# read-only (least privilege); release.yml is the only workflow that needs write.
permissions:
  contents: read

# Cancel in-progress runs on the same branch to prevent wasteful re-runs when
# multiple commits are pushed in quick succession (e.g., on PR updates).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the dispatch-selected platform(s) into the test matrix. A job-level
  # `if` cannot reference the `matrix` context, so filtering happens HERE in a tiny
  # Linux job — non-selected platforms then never spin up a runner at all (matters:
  # macOS bills 10x).
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          all='[
            {"name":"linux-amd64","runner":"ubuntu-24.04"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm"},
            {"name":"darwin-arm64","runner":"macos-latest"},
            {"name":"windows-amd64","runner":"windows-latest"}
          ]'
          # linux-arm64 builds natively on GitHub's arm64 Linux runner — no
          # cross-compilation. Both blockers are cleared: the arm64 LLVM tools
          # (22.1.0) and the aarch64 musl CRT are catalogued in
          # tools/build/blobs.json, so bin/build self-fetches them exactly as it
          # does on amd64. NOTE: ubuntu-24.04-arm is free for public repos but
          # metered on private ones — if a run fails to pick up a runner, that
          # billing plan is why, not the workflow.
          # Deferred (docs/release-automation.md §7): darwin-amd64 (macos-13, no
          # working Xcode CLT).
          if [ "$PLATFORM" = "all" ]; then
            inc=$(echo "$all" | jq -c .)
          else
            inc=$(echo "$all" | jq -c --arg n "$PLATFORM" '[.[] | select(.name == $n)]')
          fi
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    name: ${{ matrix.name }}
    # Windows is consistently the slowest host: observed 44-50m on runs #20-22,
    # 38m on #23, and #24 was cancelled at the 40m cap mid-test-suite. 75m gives
    # real headroom over the worst observed run while still bounding a hang well
    # under the GitHub-hosted ceiling of 360m.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # bin/build and bin/test self-fetch the pinned LLVM slim blobs (opt/llc/lld
    # plus the build-only llvm-dlltool) via `gh release download` from the
    # deps-llvm-<version> release. On GitHub Actions `gh` needs GH_TOKEN; the
    # read-only GITHUB_TOKEN suffices for downloading release assets.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: compiler/go.mod
          cache: true
          cache-dependency-path: compiler/go.sum

      # No Java/ANTLR step: the generated parser (compiler/internal/parser/*.go) is
      # committed, so neither CI nor a release regenerates it.

      # No LLVM install step either: `bin/build` self-fetches the pinned LLVM
      # (opt/llc/lld) from the `deps-llvm-<version>` release the maintainer
      # pre-staged locally (T0798). The blobs are content-addressed brotli-11
      # slices — ~3-4× smaller than the upstream tarball, cached in the
      # host-stable prebuilts cache, and used identically by debug + release
      # builds. Nothing is taken from the runner's PATH: for an air-gapped run,
      # point at each binary explicitly with PROMISE_OPT / PROMISE_LLC / the
      # platform linker's PROMISE_LLD or PROMISE_LD64LLD (T2108). Note that a
      # gate refuses to report a measurement made under such an override.

      # No musl-dev install: the CRT for static-linked Linux output is a pinned
      # prebuilt fetched by `bin/build` like LLVM itself (T0530). Nothing in the
      # build reads /usr/lib/<arch>-linux-musl any more.

      - name: Install wasmtime (runtime for the wasm32-wasi tests)
        uses: bytecodealliance/actions/wasmtime/setup@v1

      # bin/ is gitignored — the forge dev tools (bin/build, bin/test, …) are compiled
      # by ./make and refuse to run stale, so bootstrap them before any bin/* use.
      - name: Bootstrap dev tools (Unix)
        if: runner.os != 'Windows'
        run: ./make
      - name: Bootstrap dev tools (Windows)
        if: runner.os == 'Windows'
        run: .\make.cmd

      # shell: bash on all platforms so `bin/build` resolves uniformly (Git Bash on
      # windows-latest appends .exe → bin/build.exe).
      - name: Build compiler
        shell: bash
        run: bin/build

      # Windows only: run the suite under a %TEMP% that carries an 8.3 short
      # component (…\PROMIS~1) — the shape of the runner's own
      # C:\Users\RUNNER~1 that reddened trunk in T2094. The GitHub image happens
      # to satisfy this today, which is exactly the complaint: stating it here
      # means the coverage does not vanish silently if the image's user or TEMP
      # ever changes (T2125). Placed immediately before the test step so nothing
      # else in the job is affected. The suite's own standing reproduction does
      # NOT depend on this step — clitest.ShortNameDir builds the short/long pair
      # itself, so the case also runs on every local bin/verify.
      # pwsh, not powershell: PowerShell 7's `>>` writes UTF-8 without a BOM,
      # which is what GITHUB_ENV parses. Windows PowerShell 5.1 defaults to
      # UTF-16LE there and the assignments are silently ignored.
      - name: Pin the 8.3 short-path case (Windows)
        if: ${{ inputs.run_tests && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $long = 'C:\t\promise-8dot3-temp'
          New-Item -ItemType Directory -Force $long | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($long).ShortPath
          if ($short -eq $long) {
            throw "8dot3 name creation is disabled on C: - this step would be a silent no-op (T2125)"
          }
          Write-Host "TMP/TEMP -> $short"
          "TMP=$short"  >> $env:GITHUB_ENV
          "TEMP=$short" >> $env:GITHUB_ENV

      - name: Test — Go + Promise
        if: ${{ inputs.run_tests }}
        shell: bash
        # Always bin/test — never `go test ./...` directly: bin/test builds and embeds
        # the stdlib/catalog modules first, which raw `go test` skips.
        # No positional mode → the CI set: compiler Go tests + Promise tests. The
        # tools/build Go suite is deliberately excluded (it assumes a POSIX
        # shell/toolchain and 8.3-free temp paths, so it is unreliable across CI
        # runners); it is opt-in via `bin/test tools`/`bin/test all` and is covered by
        # local `bin/verify`.
        # NOTE: no --wasm here. Running the full suite on wasm32-wasi ~doubles CI cost,
        # so the wasm target is covered by a separate periodic workflow, not per-PR CI.
        run: bin/test
